version: '3.8'

services:
  ros2-humble:
    build: .
    image: ros2-humble-moveit
    container_name: steerbot-ros2-humble
    volumes:
      - .:/workspace
      - C:\Users\rohit\Downloads\isaac-sim-standalone-5.1.0-linux-x86_64:/isaac-sim
    working_dir: /workspace
    environment:
      - DISPLAY=host.docker.internal:0
      - STEERBOT_PROJECT=/workspace
      - ISAAC_SIM_PATH=/isaac-sim
    stdin_open: true
    tty: true
    network_mode: host
