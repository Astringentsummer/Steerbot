# Task configuration for G29 + Piper arm
task:
  name: G29Piper
  physics_engine: physx
  
  env:
    numEnvs: 512  # Parallel environments on GPU
    envSpacing: 2.0  # Meters between environments
    episodeLength: 500  # Max steps per episode
    
    clipObservations: 5.0
    clipActions: 1.0
    
    # Reward weights
    distanceWeight: 10.0
    smoothnessWeight: 0.5
    energyWeight: 0.1
    successBonus: 10.0
    
  sim:
    dt: 0.0166  # 60 Hz
    substeps: 2
    up_axis: "z"
    use_gpu_pipeline: True
    gravity: [0.0, 0.0, -9.81]
    
    physx:
      num_threads: 4
      solver_type: 1  # TGS
      use_gpu: True
      num_position_iterations: 8
      num_velocity_iterations: 0
      contact_offset: 0.002
      rest_offset: 0.001
      bounce_threshold_velocity: 0.2
      max_depenetration_velocity: 1000.0
      default_buffer_size_multiplier: 5.0
      
  domain_randomization:
    randomize: True
    randomization_params:
      frequency: 600  # Randomize every N steps
      observations:
        range: [0, .002]  # Noise on observations
      actions:
        range: [0., .02]  # Noise on actions
      sim_params:
        gravity:
          range: [0, 0.4]
          operation: "additive"
          distribution: "gaussian"
