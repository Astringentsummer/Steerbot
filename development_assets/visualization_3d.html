<!DOCTYPE html>
<html>

<head>
    <title>Steerbot Milestone: 6-DOF Gripper Precision</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #ffffff;
            font-family: 'Arial', sans-serif;
        }

        /* Matplotlib-style Overlay Card */
        #telemetry-box {
            position: absolute;
            top: 40px;
            left: 40px;
            background-color: #ece0c6;
            /* Beige/Sand color from screenshot */
            border: 1px solid #999;
            border-radius: 8px;
            padding: 15px;
            width: 240px;
            box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.1);
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            color: #333;
            line-height: 1.6;
        }

        .tel-header {
            font-weight: bold;
            margin-bottom: 5px;
            border-bottom: 1px solid #aaa;
            padding-bottom: 5px;
        }

        .success {
            color: #27ae60;
            font-weight: bold;
        }

        .planning {
            color: #2980b9;
        }

        #title-main {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #111;
        }

        #footer-info {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #888;
            font-size: 11px;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>
    <div id="title-main">3D Gripper + G29 Steering Wheel Simulation</div>

    <div id="telemetry-box">
        <div class="tel-header">SYSTEM STATE</div>
        <div>Phase: <span id="val-phase" class="planning">READY</span></div>
        <div>Gripper: <span id="val-grip-width">0.0</span> mm</div>
        <div>Wheel Angle: <span id="val-wheel-angle">0.0</span>°</div>
        <div>Gripping: <span id="val-gripping">NO</span></div>
        <div style="margin-top: 5px; font-size: 12px; color: #666;">ROS2: <span id="val-ros">MoveIt2 (Planning)</span>
        </div>
    </div>

    <div id="footer-info">Professional Milestone Release | Piper 6-DOF Manipulator | Steerbot Project</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- 3rd MONTH MILESTONE CONFIG ---
        const TABLE_H = 0.7;
        const ROBOT_X = 0.25;  // Optimized for reach
        const WHEEL_X = -0.15; // Centered
        const WHEEL_Y = 0.88;
        const RIM_R = 0.135;

        // Kinematic Lengths (Meters)
        const L_BASE = 0.123;
        const L_UPPER = 0.285;
        const L_FORE = 0.250;
        const L_HAND = 0.080;

        // Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff); // White back-drop like Matplotlib

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(1.4, 1.2, 1.4);
        camera.lookAt(0, 0.75, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const light = new THREE.PointLight(0xffffff, 0.8);
        light.position.set(2, 4, 2);
        scene.add(light);

        // Grid (Subtle gray like screenshot)
        const grid = new THREE.GridHelper(2, 20, 0xcccccc, 0xeeeeee);
        grid.position.y = 0.01;
        scene.add(grid);

        // --- MODELS ---
        // Colors: Green fingers (#2ecc71), Blue wheel (#3498db)
        const matGray = new THREE.MeshStandardMaterial({ color: 0x444444 });
        const matSilver = new THREE.MeshStandardMaterial({ color: 0xdddddd });
        const matGreen = new THREE.MeshStandardMaterial({ color: 0x2ecc71 }); // TARGET GREEN
        const matBlue = new THREE.MeshStandardMaterial({ color: 0x3498db });  // TARGET BLUE

        const robotBase = new THREE.Group();
        robotBase.position.set(ROBOT_X, TABLE_H, 0);
        scene.add(robotBase);

        const j1 = new THREE.Group(); j1.position.y = L_BASE; robotBase.add(j1);
        const j2 = new THREE.Group(); j1.add(j2);
        const j3 = new THREE.Group(); j3.position.y = L_UPPER; j2.add(j3);
        const j5 = new THREE.Group(); j5.position.y = L_FORE; j3.add(j5);

        // Visual Links
        const link1 = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, L_BASE), matGray);
        link1.position.y = -L_BASE / 2; robotBase.add(link1);

        const link2 = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, L_UPPER), matGray);
        link2.position.y = L_UPPER / 2; j2.add(link2);

        const link3 = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, L_FORE), matSilver);
        link3.position.y = L_FORE / 2; j3.add(link3);

        const handGroup = new THREE.Group();
        j5.add(handGroup);
        const wrist = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.07, 0.04), matGray);
        wrist.position.y = 0.03; handGroup.add(wrist);

        const f1 = new THREE.Mesh(new THREE.BoxGeometry(0.015, 0.07, 0.02), matGreen); // GREEN FINGERS
        const f2 = f1.clone();
        f1.position.set(-0.025, 0.08, 0); f2.position.set(0.025, 0.08, 0);
        handGroup.add(f1); handGroup.add(f2);

        // Steering Wheel (BLUE)
        const wheel = new THREE.Group();
        wheel.position.set(WHEEL_X, WHEEL_Y, 0);
        wheel.rotation.y = -Math.PI / 2;
        scene.add(wheel);
        const rim = new THREE.Mesh(new THREE.TorusGeometry(RIM_R, 0.025, 16, 64), matBlue); // BLUE WHEEL
        wheel.add(rim);
        const center = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.01), matBlue);
        center.rotation.x = Math.PI / 2; wheel.add(center);

        // --- DIRECT DETERMINISTIC KINEMATICS ---
        function solveDirect(tx, ty, tz) {
            const rx = tx - ROBOT_X;
            const ry = ty - (TABLE_H + L_BASE);
            const rz = tz;

            const dist2D = Math.sqrt(rx * rx + rz * rz);
            const dSq = dist2D * dist2D + ry * ry;
            const d = Math.sqrt(dSq);

            // Safety check for reach
            const maxR = (L_UPPER + L_FORE) * 0.99;
            let effD2D = dist2D, effY = ry, effDSq = dSq;
            if (d > maxR) {
                const s = maxR / d; effD2D *= s; effY *= s; effDSq = maxR * maxR;
            }

            const cosE = (effDSq - L_UPPER * L_UPPER - L_FORE * L_FORE) / (2 * L_UPPER * L_FORE);
            const elbow = Math.acos(Math.max(-1, Math.min(1, cosE)));

            const k1 = L_UPPER + L_FORE * Math.cos(elbow);
            const k2 = L_FORE * Math.sin(elbow);
            const shoulder = Math.atan2(effY, effD2D) - Math.atan2(k2, k1);

            return {
                base: isNaN(rz / rx) ? 0 : Math.atan2(rz, rx),
                shoulder: isNaN(shoulder) ? 1.5 : shoulder,
                elbow: isNaN(elbow) ? 0 : elbow
            };
        }

        // --- LIVE DATA SYNCHRONIZATION ---
        let simState = {
            phase: "STANDBY",
            gripper_width: 60.0,
            wheel_angle: 0.0,
            is_holding: false,
            ros_mode: "MoveIt2 (Ready)",
            joints: { base: 0, shoulder: 1.5, elbow: 0 }
        };

        async function fetchSimData() {
            try {
                const response = await fetch('digital_twin_state.json');
                if (response.ok) {
                    const data = await response.json();
                    simState = data;
                }
            } catch (err) {
                // Silently wait for the simulation to start
            }
        }

        // Poll for data every 50ms
        setInterval(fetchSimData, 50);

        function update() {
            requestAnimationFrame(update);
            try {
                // Apply Simulation State to 3D Models
                j1.rotation.y = simState.joints.base;
                j2.rotation.z = Math.PI / 2 - simState.joints.shoulder;
                j3.rotation.z = -simState.joints.elbow;
                j5.rotation.z = simState.joints.shoulder + simState.joints.elbow - Math.PI / 2;

                const fingerGap = (simState.gripper_width / 1000) / 2;
                f1.position.x = -0.01 - fingerGap;
                f2.position.x = 0.01 + fingerGap;
                wheel.rotation.z = simState.wheel_angle;

                // Visual Feedback for "HOLDING" state
                if (simState.is_holding) {
                    f1.material.emissive.setHex(0x2ecc71);
                    f1.material.emissiveIntensity = 0.5;
                    f2.material.emissive.setHex(0x2ecc71);
                    f2.material.emissiveIntensity = 0.5;
                } else {
                    f1.material.emissive.setHex(0x000000);
                    f2.material.emissive.setHex(0x000000);
                }

                // Update Telemetry Overlay
                document.getElementById('val-phase').innerText = simState.phase;
                document.getElementById('val-grip-width').innerText = simState.gripper_width.toFixed(1);
                document.getElementById('val-wheel-angle').innerText = (simState.wheel_angle * 180 / Math.PI).toFixed(1);

                const gripText = simState.is_holding ? "YES (LOCKED)" : "NO";
                document.getElementById('val-gripping').innerText = gripText;
                document.getElementById('val-gripping').className = simState.is_holding ? "success" : "";

                document.getElementById('val-ros').innerText = simState.ros_mode;

                renderer.render(scene, camera);
            } catch (e) {
                console.error("Dashboard Render Error:", e);
            }
        }
        update();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
