api_version: 1.0

# Robot description for Piper arm
robot_description:
  kinematics:
    # Configuration space (joint names)
    cspace:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    
    # Root link
    root_link: base_link
    
    # End effector link
    end_effector_link: link6
    
    # Default joint configuration
    default_q: [0.0, -0.3, 0.5, 0.0, 0.5, 0.0]

# Collision spheres for self-collision avoidance
collision_spheres:
  - link1:
      - "center": [0.0, 0.0, 0.05]
        "radius": 0.05
  - link2:
      - "center": [0.0, 0.0, 0.1]
        "radius": 0.04
      - "center": [0.0, 0.0, 0.2]
        "radius": 0.04
  - link3:
      - "center": [0.0, 0.0, 0.1]
        "radius": 0.04
      - "center": [0.0, 0.0, 0.2]
        "radius": 0.04
  - link4:
      - "center": [0.0, 0.0, 0.05]
        "radius": 0.03
  - link5:
      - "center": [0.0, 0.0, 0.05]
        "radius": 0.03
  - link6:
      - "center": [0.0, 0.0, 0.03]
        "radius": 0.025

# Joint limits (degrees)
joint_limits:
  joint1: [-180, 180]
  joint2: [-90, 90]
  joint3: [-135, 135]
  joint4: [-180, 180]
  joint5: [-90, 90]
  joint6: [-180, 180]

# IK solver configuration
ik_solver:
  position_tolerance: 0.01  # 1cm
  orientation_tolerance: 0.1  # radians
  max_iterations: 100000
  convergence_threshold: 0.001
